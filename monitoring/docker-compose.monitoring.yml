services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: monitoring-prometheus
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      APP_DEBATE_TARGET: ${APP_DEBATE_TARGET}
      NODE_EXPORTER_TARGET: ${NODE_EXPORTER_TARGET}
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  cloudwatch-exporter:
    image: ${CLOUDWATCH_EXPORTER_IMAGE}
    container_name: monitoring-cloudwatch-exporter
    # 자격증명은 EC2 IAM 인스턴스 역할에서 자동 획득. 키 주입 불필요.
    ports:
      - "9106:9106"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: monitoring-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
