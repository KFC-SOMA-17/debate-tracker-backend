services:
  mysql:
    image: mysql:8.4
    container_name: debate-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-debate}
      MYSQL_USER: ${MYSQL_USER:-debate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-debate}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: debate-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-debate:
    build:
      context: .
      dockerfile: app-debate/Dockerfile
    container_name: debate-app
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-debate}
      DB_USER: ${MYSQL_USER:-debate}
      DB_PASSWORD: ${MYSQL_PASSWORD:-debate}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
