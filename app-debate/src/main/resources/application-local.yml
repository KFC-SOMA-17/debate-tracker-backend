spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/${DB_NAME:debate}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:debate}
    password: ${DB_PASSWORD:debate}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
