spring:
  application:
    name: app-debate
  profiles:
    active: local
  config:
    import:
      - classpath:stt-config.yml
      - classpath:llm-config.yml

  jpa:
    open-in-view: false

  cache:
    type: redis

  flyway:
    enabled: false

  ai:
    chat:
      client:
        enabled: true

llm:
  enabled: true
