spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  data:
    redis:
      database: ${TEST_REDIS_DATABASE:1} # local 환경 구분

  cache:
    type: redis

  flyway:
    enabled: false
