spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local-test}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  cache:
    type: redis

  flyway:
    enabled: false

cors:
  origin-urls: ["http://localhost:3000", "http://localhost:5173"]
