spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:debate-test
    username: sa
    password:

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false
