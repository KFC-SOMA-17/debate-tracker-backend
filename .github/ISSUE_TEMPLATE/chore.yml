name: "Chore Template"
description: 기타 이슈 템플릿
title: "[CHORE] "
labels: ["chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: ✨ Description
      description: 이슈에 대한 설명을 작성해주세요.
      placeholder: 어떤 작업이 필요한가요?

  - type: input
    id: deadline
    attributes:
      label: ✨ Time (마감기한)
      description: |
        ⚠️ **반드시 `YYYY-MM-DD` 형식으로 입력해주세요.**
        예시: 2026-06-15
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
