name: Dev CD

on:
  push:
    branches:
      - develop
      - fix/#80-delete-sockjs
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'monitoring/**'
      - '.github/workflows/Monitoring_CD.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setting dev-secret.yml
        run: |
          echo "${{ secrets.DEV_SECRET_YML }}" > app-debate/src/main/resources/dev-secret.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DEV_DOCKERHUB_USERNAME }}
          password: ${{ secrets.DEV_DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app-debate/Dockerfile
          push: true
          tags: |
            debatetracker/debate-tracker-repo:latest
            debatetracker/debate-tracker-repo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: docker-compose.dev.yml
          target: app-debate

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: debatetracker/debate-tracker-repo:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DEV_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DEV_DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd app-debate

            echo "IMAGE=${IMAGE}" > .env

            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d
            docker image prune -f

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8083/monitoring/health; then
                echo ""
                echo "health check passed"
                exit 0
              fi
              echo "waiting for app to be healthy... ($i/30)"
              sleep 5
            done
            echo "health check failed after 150s"
            exit 1
